name: Publish Chrome extension

# Publishing is always manual: run it from the Actions tab or with bin/publish.sh.
on:
  workflow_dispatch:

concurrency:
  group: publish-chrome-extension
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release tag

    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Publish from main (this run is on ${GITHUB_REF})."
          exit 1

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: current
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # The Chrome Web Store requires a higher version on every upload, so stamp
      # <major>.<minor> from manifest.json with the workflow run number.
      - name: Set extension version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const [major = "0", minor = "0"] = manifest.version.split(".");
            manifest.version = `${major}.${minor}.${process.env.RUN_NUMBER}`;
            fs.writeFileSync("manifest.json", JSON.stringify(manifest, null, 2) + "\n");
            console.log(`Publishing version ${manifest.version}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${manifest.version}\n`);
          '

      - name: Package extension
        run: npm run build:bundle

      - name: Publish to Chrome Web Store
        uses: puzzlers-labs/chrome-webstore-publish@f4482432879e6db4a2bd2a5691b5983e5b59dfc2 # v1.3.1
        with:
          mode: publish
          extension_id: ${{ secrets.CHROME_EXTENSION_ID }}
          zip_file_path: ./dist/github-tabs.zip
          client_id: ${{ secrets.CHROME_EXTENSION_CLIENT_ID }}
          client_secret: ${{ secrets.CHROME_EXTENSION_CLIENT_SECRET }}
          refresh_token: ${{ secrets.CHROME_EXTENSION_REFRESH_TOKEN }}
          publish_target: public

      # Tag only after the store accepted the upload, so every tag is a shipped version.
      - name: Tag release
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "Tagged $TAG" >> "$GITHUB_STEP_SUMMARY"
